name: mythforge

services:
  postgres:
    image: postgres:16-alpine
    container_name: mythforge-postgres
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: forge
    ports:
      - "127.0.0.1:55440:5432"
    volumes:
      - mythforge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: mythforge-api
    environment:
      DATABASE_URL: postgres://forge:forge@postgres:5432/forge
      ADMIN_DATABASE_URL: postgres://forge:forge@postgres:5432/postgres
      PORT: "8080"
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-glm-5.3-flash}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-please-0123456789}
      APP_URL: ${APP_URL:-http://localhost:8080}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ANTHROPIC_MAX_TOKENS: ${ANTHROPIC_MAX_TOKENS:-8192}
      RUST_LOG: info,sqlx=warn
    ports:
      - "127.0.0.1:18093:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Static frontend + /api reverse proxy, the edge nginx vhost points here.
  web:
    image: nginx:1.27-alpine
    container_name: mythforge-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:18443:80"
    volumes:
      - ./nginx-web.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/build:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12

volumes:
  mythforge_pgdata:
