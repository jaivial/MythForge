[workspace]
resolver = "2"
members = ["crates/misanthropy", "crates/forge"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "fs"] }
axum = { version = "0.7", features = ["json", "tokio", "query"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json", "chrono", "uuid", "migrate", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
argon2 = "0.5"
jsonwebtoken = "9"
thiserror = "2"
anyhow = "1"
futures-util = "0.3"
rand = "0.8"
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
regex = "1"
once_cell = "1"
cron = "0.12"
urlencoding = "2"
async-trait = "0.1"
dotenvy = "0.15"
misanthropy = { path = "crates/misanthropy" }

[profile.release]
opt-level = 2
